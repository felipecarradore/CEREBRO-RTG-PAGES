name: Validate Cerebro Access credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate account and Access organization
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.error
          token=os.environ['CF_TOKEN']
          def get(path):
            req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,headers={'Authorization':'Bearer '+token})
            try:
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)['result']
            except urllib.error.HTTPError as e:
              print('Cloudflare endpoint',path,'HTTP',e.code)
              raise SystemExit(1)
          accounts=get('/accounts')
          if len(accounts)!=1:
            print('Explicit account selection required; account count:',len(accounts))
            raise SystemExit(1)
          a=accounts[0]['id']
          org=get('/accounts/'+a+'/access/organizations')
          print('Access organization configured:', bool(org and org.get('auth_domain')))
          if not org or not org.get('auth_domain'): raise SystemExit(1)
          providers=get('/accounts/'+a+'/access/identity_providers')
          print('Identity provider types:',[p['type'] for p in providers])
          print('Access credential read validation passed')
